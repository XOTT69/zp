# Install as .github/workflows/slack-profiles.yml once repository workflow access is available.
# Configure these secrets before enabling. This workflow reads profiles; it sends no messages.
name: Refresh Slack login index
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */12 * * *'
permissions:
  contents: read
concurrency:
  group: slack-login-index
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/sync-slack-profiles.mjs
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_TEAM_ID: ${{ secrets.SLACK_TEAM_ID }}
          SLACK_LDAP_FIELD_ID: ${{ secrets.SLACK_LDAP_FIELD_ID }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
